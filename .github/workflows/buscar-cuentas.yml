name: Buscar Cuentas Instagram

on:
  push:
    paths:
      - 'search-params.json'

permissions:
  contents: read
  issues: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/add-find-skills-OlSXP

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run search
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          NICHO=$(python3 -c "import json; d=json.load(open('search-params.json')); print(d['nicho'])")
          PAIS=$(python3 -c "import json; d=json.load(open('search-params.json')); print(d['pais'])")
          CANTIDAD=$(python3 -c "import json; d=json.load(open('search-params.json')); print(d['cantidad'])")
          MODO=$(python3 -c "import json; d=json.load(open('search-params.json')); print(d.get('modo','viral'))")
          python tools/buscar_cuentas.py \
            --nicho "$NICHO" \
            --pais "$PAIS" \
            --cantidad $CANTIDAD \
            --modo $MODO \
            --token "$APIFY_TOKEN" > search-results.txt 2>&1 || true
          cat search-results.txt

      - name: Post results as issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULTS=$(cat search-results.txt 2>/dev/null || echo 'No output')
          gh issue create \
            --title "Search results: $(cat search-params.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['nicho'],d['pais'])")" \
            --body "$(printf '\`\`\`\n%s\n\`\`\`' "$RESULTS")" \
            --repo miguel21abad-coder/mangel
