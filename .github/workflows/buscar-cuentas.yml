name: Buscar Cuentas Instagram

on:
  push:
    paths:
      - 'search-params.json'

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/add-find-skills-OlSXP

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run search
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          NICHO=$(python3 -c "import json; d=json.load(open('search-params.json')); print(d['nicho'])")
          PAIS=$(python3 -c "import json; d=json.load(open('search-params.json')); print(d['pais'])")
          CANTIDAD=$(python3 -c "import json; d=json.load(open('search-params.json')); print(d['cantidad'])")
          MODO=$(python3 -c "import json; d=json.load(open('search-params.json')); print(d.get('modo','viral'))")
          python tools/buscar_cuentas.py \
            --nicho "$NICHO" \
            --pais "$PAIS" \
            --cantidad $CANTIDAD \
            --modo $MODO \
            --token "$APIFY_TOKEN" > search-results.txt 2>&1 || true
          echo "--- EXIT ---" >> search-results.txt
          cat search-results.txt

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/add-find-skills-OlSXP
          git add search-results.txt
          git diff --staged --quiet || git commit -m "Search results [skip ci]"
          git push
